    <script type="application/ld+json">

            "@id": "https://makeflow.com.au/#organization",

            "publisher": { "@id": "https://makeflow.com.au/#organization" }

          {
            "@type": "Service",

          {
            "@type": "FAQPage",

                "@type": "Question",

              {
                "@type": "Question",
                "name": "How long does it take?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Usually 2 to 3 minutes. We crawl your site, write 30 to 50 questions, run each one twice and score the answers."
                }
              },
              {
                "@type": "Question",
                "name": "Is it really free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. One free report per email every 30 days. Fixing what it finds, whether that is schema, pages, listings or technical fixes, is MakeFlow's paid SEO work."
                }
              }
            ]
          }
